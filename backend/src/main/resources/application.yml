spring:
  config:
    import: optional:file:../.env[.properties]
  application:
    name: wedora-api
  messages:
    basename: messages
    encoding: UTF-8
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://ep-long-sun-bbd4amz0-pooler.c-15.us-east-1.aws.neon.tech/wedmaster?sslmode=require&channel_binding=require}
    username: ${DATABASE_USERNAME:neondb_owner}
    password: ${DATABASE_PASSWORD:npg_beAya4nDYm9S}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}
server:
  port: ${PORT:8080}
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-replace-this-before-deploying-123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  uploads-dir: ${UPLOADS_DIR:./uploads}
  chat-uploads-dir: ${CHAT_UPLOADS_DIR:./chat-uploads}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      model: ${OLLAMA_MODEL:llama3.2:3b}
      timeout-seconds: ${OLLAMA_TIMEOUT_SECONDS:180}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:notifications@wedora.local}
management:
  endpoints:
    web:
      exposure:
        include: health,info
